<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Xash - Vend</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta
      name="description"
      content="Xash - Comprehensive documentation for Xash, a powerful platform for bill payments across Africa."
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css"
    />
    <link rel="shortcut icon" type="image/x-icon" href="_media/favicon.ico" />
    <style>
      :root {
        --theme-color: #fa447c;
        --update-banner-height: 34px;
      }
      footer {
        text-align: center;
        margin-bottom: 15px;
      }
      #mb-footer a {
        color: #fa447c;
      }
      body {
        background: #000;
        color: #e6e6e6;
        padding-top: var(--update-banner-height);
      }
      .app-nav,
      .sidebar,
      .app-sidebar,
      .sidebar-nav {
        background: #000;
      }
      .sidebar-nav a {
        color: #cfcfcf;
      }
      .sidebar-nav a.active,
      .sidebar-nav a:hover {
        color: #fa447c;
      }
      .markdown-section code,
      .markdown-section pre,
      .markdown-section pre > code {
        background: #111;
        color: #f2f2f2;
      }
      .markdown-section pre {
        border: 1px solid #222;
      }
      .markdown-section table {
        background: #0d0d0d;
        border-color: #222;
      }
      .markdown-section th {
        background: #111;
      }
      .markdown-section tr:nth-child(even) {
        background: #0b0b0b;
      }
      .update-banner {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 999;
        height: var(--update-banner-height);
        background: #0d0d0d;
        border-bottom: 1px solid #222;
        color: #cfcfcf;
        font-size: 12px;
        letter-spacing: 0.02em;
      }
      .update-banner__inner {
        max-width: 1100px;
        margin: 0 auto;
        height: var(--update-banner-height);
        padding: 0 16px;
        display: flex;
        flex-wrap: nowrap;
        gap: 8px;
        align-items: center;
        overflow-x: auto;
        white-space: nowrap;
        -webkit-overflow-scrolling: touch;
      }
      .update-banner a {
        color: #fa447c;
        text-decoration: none;
      }
      .update-banner a:hover {
        text-decoration: underline;
      }
      .update-banner__label {
        color: #8f8f8f;
      }
      .update-banner__date {
        color: #8f8f8f;
      }
      .update-banner__sep {
        color: #333;
      }
      .sidebar,
      .app-sidebar {
        top: var(--update-banner-height);
        height: calc(100% - var(--update-banner-height));
      }
      .sidebar-toggle {
        top: calc(10px + var(--update-banner-height));
      }
    </style>
  </head>
  <body>
    <div class="update-banner">
      <div class="update-banner__inner">
        <span class="update-banner__label">Latest updates:</span>
        <span class="update-banner__date"
          >Updated <span id="update-banner-date">26 May 2026</span></span
        >
        <span class="update-banner__sep">|</span>
        <a href="#/auth/server-tokens">Server Tokens</a>
        <span class="update-banner__sep">|</span>
        <a href="#/dstv/">DStv Subscriptions</a>
        <span class="update-banner__sep">|</span>
        <a href="#/reports/history">Account History Filters</a>
      </div>
    </div>
    <div id="app">
      <div align="center">A moment...</div>
    </div>
    <footer id="mb-footer"></footer>
    <script>
      window.$docsify = {
        name: "Xash Docs",
        repo: "joemunapo/vend-docs",
        themeColor: "#FA447C",
        loadSidebar: true,
        auto2top: true,
        logo: "/_media/xash.png",
        autoFooter: {
          // the name you wish to display as the copyright holder
          name: " | Xash Solutions",

          // the URL (personal or company) which clicking the `name` goes to
          url: "https://xash.co.zw",

          // code to dynamicaly get the current year using JS
          copyYear: new Date().getFullYear(),
          // show the privacy policy link
          policy: false,

          // show the terms of service link
          terms: false,

          // show the cookies policy link
          cookies: false,

          // use your own css styles or the built in ones
          customStyle: false,
        },
      };
    </script>
    <!-- Docsify v4 -->
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
    <script src="https://unpkg.com/@markbattistella/docsify-sidebarfooter@latest"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var sidebarLinks = document.querySelectorAll(".sidebar-nav a");
        sidebarLinks.forEach(function (link) {
          link.addEventListener("click", function () {
            var sidebar = document.querySelector(".app-sidebar");
            if (sidebar.classList.contains("app-sidebar-open")) {
              sidebar.classList.remove("app-sidebar-open");
            }
          });
        });
      });
    </script>
  </body>
</html>
